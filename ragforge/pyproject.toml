[project]
name = "ragforge"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "pydantic>=2.7.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-chroma>=0.1.3",
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "ragas>=0.1.18",
    "datasets>=2.18.0",
    "langfuse>=2.40.0",
    "streamlit>=1.35.0",
    "sentence-transformers>=3.0.0",
    "cohere>=5.5.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ragforge = "ragforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforge"]
